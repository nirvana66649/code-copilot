[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-copilot-copy"
version = "0.1.0"
description = "Local coding assistant that answers repository questions with source citations."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
]
#cmd

[project.scripts]
coding-copilot = "coding_copilot_copy.cli:main" 

# 表示开发时才装 pytest：
[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["coding_copilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]